<style>
:root{--ink:#f2f7ff;--i2:rgba(242,247,255,.7);--i3:rgba(242,247,255,.45);--E:cubic-bezier(.22,1,.36,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{font:500 14px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#031030;display:flex;justify-content:center;align-items:center;overflow:hidden}

#app{position:relative;width:min(100%,430px);height:100%;overflow:hidden;background:radial-gradient(120% 55% at 100% 0%,rgba(80,200,255,.42),transparent 62%),radial-gradient(90% 50% at 0% 100%,rgba(30,110,255,.5),transparent 65%),linear-gradient(175deg,#06174a 0%,#0b3aa3 45%,#1673e6 80%,#33bff2 100%)}
@media(min-width:500px){#app{height:min(100%,880px);border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12)}}

#view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 178px;scrollbar-width:none;contain:layout style;will-change:scroll-position;transform:translateZ(0)}

#bg{position:absolute;inset:0;transform:translateZ(0);contain:strict}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,16,70,.38),rgba(4,16,70,.12) 45%,rgba(4,16,70,.4))}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}

.top .chips{margin:0;padding:0;flex:1}

.sb-ring i{background:conic-gradient(transparent 0 55%,#7fd0ff 80%,#c4b5fd 92%,transparent 100%)}
.sbi{position:relative;z-index:1;height:100%;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;border-radius:inherit;background:rgba(8,10,28,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--i2);transform:translateZ(0)}

.sr .val{color:var(--i2);display:flex;align-items:center;gap:2px;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:700}
.btn.red{color:#ffb3b3;background:rgba(255,90,90,.16)}
.note{color:var(--i3);font-size:12px;font-weight:500;margin-top:10px}
#mini{position:absolute;left:8px;right:8px;bottom:80px;height:58px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 8px;overflow:hidden;transition:background-color 1s;background:color-mix(in srgb,var(--tint,#2a6be0) 40%,#071a58);box-shadow:0 6px 18px rgba(2,10,45,.35)}

#mp{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.pb{width:44px;height:44px;border-radius:50%;background:#fff;color:#0a2f86;display:grid;place-items:center;flex:none;transition:transform .4s var(--E)}
.pb:active{transform:scale(.9)}
#nav{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;z-index:3}
.nimbus-nav{--n-tint:rgba(10,18,40,.26);--n-fg:#F1F7FF;--n-fg-soft:rgba(241,247,255,.66);--n-rim:rgba(255,255,255,.34);display:inline-flex;align-items:center;gap:2px;padding:6px;border-radius:999px;isolation:isolate;user-select:none;touch-action:manipulation}
.nimbus-glass{position:absolute;inset:0;border-radius:inherit;z-index:-2;overflow:hidden;background:var(--n-tint);-webkit-backdrop-filter:blur(10px) saturate(1.2) brightness(1.08);backdrop-filter:blur(10px) saturate(1.2) brightness(1.08);box-shadow:inset 0 1px 1px var(--n-rim),inset 0 0 0 1px rgba(255,255,255,.2),0 12px 32px -14px rgba(0,40,90,.5),0 2px 6px rgba(0,40,90,.1)}

.nimbus-nav[data-gl="off"] .nimbus-drop{display:block}
.nimbus-item{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:999px;color:var(--n-fg-soft);transition:color .25s}
.nimbus-item:hover,.nimbus-item[aria-current="page"]{color:var(--n-fg)}

.nimbus-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nv-ico{position:relative;display:inline-flex;flex:none}
.nv-ico svg{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.nimbus-item[aria-current="page"] .nv-ico svg{transform:translateY(-1px) scale(1.08)}

.nv-ico[data-fx="pop"] svg{animation:nvPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes nvPop{0%{transform:scale(.72)}60%{transform:scale(1.2)}100%{transform:translateY(-1px) scale(1.08)}}

.nv-ico[data-fx="glow"] svg{animation:nvHop .8s cubic-bezier(.3,1.4,.5,1) both;transform-origin:50% 100%}
@keyframes nvHop{0%{transform:none}30%{transform:translateY(-5px) scale(1.04,.96)}55%{transform:translateY(0) scale(1.12,.88)}75%{transform:translateY(-2px) scale(.98,1.04)}100%{transform:translateY(-1px) scale(1.08)}}
.nv-ico[data-fx="glow"] .nv-door{animation:nvDoor 1.3s ease both}
@keyframes nvDoor{0%{fill:transparent}30%{fill:#FFF3A8}100%{fill:rgba(126,232,255,.6)}}
.nv-ico[data-fx="wave"] svg{animation:nvWave .9s ease-in-out both;transform-origin:50% 92%}
@keyframes nvWave{0%{transform:none}20%{transform:rotate(-15deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}100%{transform:translateY(-1px) scale(1.08)}}

.chip svg{vertical-align:-3px;margin-right:6px}

.eqb{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.ev,.el{font-size:11px;color:var(--i2)}

.et::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.25)}
.ef{position:absolute;left:50%;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#fff;height:calc(var(--v)*1%)}

.tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tb{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.1);transition:background .3s}
.tb b{display:block;font-size:14px}

.cs{margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center}

.fxc .chip{display:inline-flex;align-items:center}

.scrim{position:absolute;inset:0;background:rgba(2,8,36,.5);opacity:0;transition:opacity .4s}
#shw.open .scrim{opacity:1}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:30px;padding:10px 12px 14px;max-height:78%;overflow-y:auto;transform:translateY(110%);transition:transform .55s var(--E);background:linear-gradient(145deg,rgba(18,60,160,.92),rgba(8,32,100,.94))}
